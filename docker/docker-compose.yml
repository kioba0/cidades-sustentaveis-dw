services:

  # ──────────────────────────────────────────────────────────────────────────
  # MySQL 8.0 — Banco Operacional OLTP (ecocidade_oltp) & DW (dw_ecocidade)
  # ──────────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ecocidade_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecocidade_oltp
    ports:
      - "3306:3306"
    volumes:
      - ecocidade_mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d   # scripts de inicialização automática (Zero-Touch)
    networks:
      - ecocidade_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Metabase BI — Visualização dos Dashboards Analíticos da Prefeitura
  # ──────────────────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: ecocidade_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./metabase-data:/metabase-data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecocidade_network

volumes:
  ecocidade_mysql_data:

networks:
  ecocidade_network:
    driver: bridge
